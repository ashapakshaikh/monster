<div class="body">
     <div class="login-container d-flex justify-content-center align-items-center">
      <div class="card login-card" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
          <h2 class="align-items-center">Monster</h2>
          <p class="text-muted text-center mb-4">Please sign in to your account</p>
          
          <form [formGroup]="loginData" (ngSubmit)="SubmitLogin()">
            <label for="Email">
                <i class="bi bi-lock me-2"></i>Email
              </label>
            <!-- Email Field -->
            <div class="form-floating mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="Email"
                placeholder="name@example.com"
                autocomplete="email"
              >
              <label for="email">
                <i class="bi bi-envelope me-2"></i>Email Address
              </label>             
            </div>
            <div *ngIf="loginData.get('Email')?.invalid && loginData.get('Email')?.touched" class="text-danger">
              <span *ngIf="loginData.get('Email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="loginData.get('Email')?.errors?.['minlength']">Email must be at least 5 characters long.</span>
              <span *ngIf="loginData.get('Email')?.errors?.['pattern']">Invalid email pattern.</span>
            </div>
            <label for="password">
                <i class="bi bi-lock me-2"></i>Password
              </label>
            <!-- Password Field -->
            <div class="form-floating mb-3 position-relative">
              <input          
                class="form-control"
                type="password"
                id="password"
                formControlName="Password"
                placeholder="Password"
                autocomplete="current-password"
              >
            <label for="password">
                <i class="bi bi-lock me-2"></i>Password
            </label>
            </div>           
                <div *ngIf="loginData.get('Password')?.invalid && loginData.get('Password')?.touched" class="text-danger">
                  <span *ngIf="loginData.get('Password')?.errors?.['required']">Password is required.</span>
                  <!-- <span *ngIf="loginData.get('Password')?.errors?.['minlength']">Password must be at least 8 characters long.</span>
                  <span *ngIf="loginData.get('Password')?.errors?.['pattern']">Password must contain at least one uppercase letter, one lowercase letter, and one number.</span> -->
                </div>         
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 mb-3" (click)="SubmitLogin()"> Sign In </button>      
          </form>
        </div>
        
        <div class="card-footer text-center py-3 bg-transparent border-0">
          <small class="text-muted">
            Don't have an account? 
            <a routerLink="/Register" class="text-decoration-none">Sign up here</a>
          </small>
        </div>
      </div>
    </div>
</div>
